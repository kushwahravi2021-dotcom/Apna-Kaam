name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed HTTPS URL of Apna Kaam"
        required: true
        type: string
      publish_release:
        description: "Publish debug APK as a GitHub Release"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build Android wrapper
        env:
          NEXT_PUBLIC_APP_URL: ${{ inputs.app_url }}
        run: |
          node -e "const u = new URL(process.env.NEXT_PUBLIC_APP_URL); if (u.protocol !== \"https:\") throw new Error(\"app_url must use HTTPS\")"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apna-kaam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: inputs.publish_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.run_number }}
          name: Apna Kaam Android Debug ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
