name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed HTTPS URL of Apna Kaam"
        required: true
        type: string
      publish_release:
        description: "Publish the built APK as the stable GitHub Release"
        required: true
        default: "yes"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build Android wrapper
        env:
          NEXT_PUBLIC_APP_URL: ${{ inputs.app_url }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e "const u = new URL(process.env.NEXT_PUBLIC_APP_URL); if (u.protocol !== 'https:') throw new Error('app_url must use HTTPS')"
          npx cap add android
          npx cap sync android
          mkdir -p dist
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/apna-kaam-release.keystore
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/apna-kaam-release.keystore"
            node scripts/configure-android-signing.mjs
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease bundleRelease
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk dist/apna-kaam.apk
            cp android/app/build/outputs/bundle/release/app-release.aab dist/apna-kaam.aab
            echo "signed-release" > dist/channel.txt
            echo "APK_CHANNEL=signed-release" >> "$GITHUB_ENV"
          else
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/apna-kaam.apk
            echo "debug" > dist/channel.txt
            echo "APK_CHANNEL=debug" >> "$GITHUB_ENV"
          fi
          sha256sum dist/apna-kaam.apk > dist/apna-kaam.apk.sha256
          rm -f android/apna-kaam-release.keystore
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apna-kaam-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable GitHub Release
        if: inputs.publish_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Apna Kaam Android — Latest
          prerelease: ${{ env.APK_CHANNEL == 'debug' }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/apna-kaam.apk
            dist/apna-kaam.aab
            dist/apna-kaam.apk.sha256
