name: Apna Kaam CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, JSON.stringify({severity:v.severity, range:v.range, fixAvailable:v.fixAvailable, advisories:v.via.map(x => typeof x === "string" ? x : x.title)}))'
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
